<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Spider Seat Allocator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="gradient"></div>

        <div class="webs"></div>

        <div class="particles"></div>

    </div>

    <!-- Landing -->

    <section id="landing">

        <h1 class="title">
            SPIDER
            <span>SEAT</span>
            RAFFLE
        </h1>

        <p class="subtitle">
            Into the Movie-Verse
        </p>

        <button id="startBtn">
            ENTER THE MULTIVERSE
        </button>

    </section>

    <!-- Main App -->

    <section id="app" class="hidden">

        <div class="glass">

            <h2>
                Enter Your Name
            </h2>

            <input
                id="nameInput"
                type="text"
                placeholder="Peter Parker...">

            <button id="spinBtn">

                SPIN THE WEB

            </button>

        </div>

    </section>

    <!-- Loading Animation -->

    <section
        id="loading"
        class="hidden">

        <div class="loader">

            <div class="spinner"></div>

            <h2>

                Searching Across The Spider-Verse...

            </h2>

        </div>

    </section>

    <!-- Reveal Card -->

    <section
        id="reveal"
        class="hidden">

        <div class="flip-card">

            <div class="flip-inner">

                <div class="front">

                    ?

                </div>

                <div class="back">

                    <h2 id="personName"></h2>

                    <h1 id="seatNumber"></h1>

                </div>

            </div>

        </div>

        <button id="continueBtn">

            NEXT PERSON

        </button>

    </section>

    <!-- Summary -->

    <section
        id="summary"
        class="hidden">

        <h1>

            Final Seat Allocation

        </h1>

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Seat</th>

                </tr>

            </thead>

            <tbody id="summaryBody">

            </tbody>

        </table>

        <button id="restartBtn">

            Restart

        </button>

    </section>

    <script src="script.js"></script>

</body>

</html>
