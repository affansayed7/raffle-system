<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spider-Man Movie Seat Raffle</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="background">
    <div class="gradient"></div>
    <div class="webs"></div>
    <div class="particles" id="particles"></div>

    <!-- Corner web decorations -->
    <svg class="corner-web corner-web--tl" viewBox="0 0 200 200" aria-hidden="true">
      <g stroke="rgba(255,255,255,0.18)" fill="none" stroke-width="1.5">
        <path d="M0,0 L60,0 M0,0 L0,60 M0,0 L45,45" />
        <path d="M0,15 Q20,20 15,0" />
        <path d="M0,32 Q35,38 32,0" />
        <path d="M0,50 Q52,58 50,0" />
      </g>
    </svg>

    <svg class="corner-web corner-web--br" viewBox="0 0 200 200" aria-hidden="true">
      <g stroke="rgba(255,255,255,0.18)" fill="none" stroke-width="1.5">
        <path d="M200,200 L140,200 M200,200 L200,140 M200,200 L155,155" />
        <path d="M200,185 Q180,180 185,200" />
        <path d="M200,168 Q165,162 168,200" />
        <path d="M200,150 Q148,142 150,200" />
      </g>
    </svg>

    <!-- Spider dangling and swaying on its own silk thread -->
    <div class="dangler">
      <div class="thread"></div>
      <svg class="spider" viewBox="0 0 40 40" aria-hidden="true">
        <g stroke="#0a0a12" stroke-width="1.6" fill="#0a0a12">
          <line x1="20" y1="18" x2="6" y2="8" />
          <line x1="20" y1="18" x2="4" y2="16" />
          <line x1="20" y1="18" x2="6" y2="26" />
          <line x1="20" y1="20" x2="8" y2="34" />
          <line x1="20" y1="18" x2="34" y2="8" />
          <line x1="20" y1="18" x2="36" y2="16" />
          <line x1="20" y1="18" x2="34" y2="26" />
          <line x1="20" y1="20" x2="32" y2="34" />
          <ellipse cx="20" cy="16" rx="6" ry="5" />
          <circle cx="20" cy="24" r="8" />
        </g>
      </svg>
    </div>

    <!-- Spider crawling back and forth along a diagonal strand -->
    <svg class="crawler" viewBox="0 0 40 40" aria-hidden="true">
      <g stroke="#e62429" stroke-width="1.6" fill="#12121e">
        <line x1="20" y1="18" x2="6" y2="8" />
        <line x1="20" y1="18" x2="4" y2="16" />
        <line x1="20" y1="18" x2="6" y2="26" />
        <line x1="20" y1="20" x2="8" y2="34" />
        <line x1="20" y1="18" x2="34" y2="8" />
        <line x1="20" y1="18" x2="36" y2="16" />
        <line x1="20" y1="18" x2="34" y2="26" />
        <line x1="20" y1="20" x2="32" y2="34" />
        <ellipse cx="20" cy="16" rx="6" ry="5" />
        <circle cx="20" cy="24" r="8" />
      </g>
    </svg>
  </div>

  <!-- Landing -->
  <section id="landing" class="screen active">
    <h1 class="title">SPIDER-MAN<span>MOVIE SEAT</span>RAFFLE</h1>
    <p class="subtitle">Into the Movie-Verse</p>
    <button id="startBtn" class="btn">Enter the Multiverse</button>
  </section>

  <!-- Name entry -->
  <section id="app" class="screen">
    <div class="glass">
      <h2>Who's up?</h2>
      <p class="hint" id="progressHint">0 of 6 seats assigned</p>
      <input id="nameInput" type="text" placeholder="Peter Parker..." autocomplete="off" />
      <button id="spinBtn" class="btn">Spin the Web</button>
      <p class="error" id="errorMsg"></p>
    </div>
  </section>

  <!-- Loading -->
  <section id="loading" class="screen">
    <div class="loader">
      <div class="spinner"></div>
      <h2>Searching across the Spider-Verse...</h2>
    </div>
  </section>

  <!-- Reveal -->
  <section id="reveal" class="screen">
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="front">?</div>
        <div class="back">
          <p class="back-label">SEAT ASSIGNED</p>
          <h2 id="personName"></h2>
          <h1 id="seatNumber"></h1>
        </div>
      </div>
    </div>
    <button id="continueBtn" class="btn hidden">Next Person</button>
  </section>

  <!-- Summary -->
  <section id="summary" class="screen">
    <h1>Final Seat Allocation</h1>
    <table>
      <thead>
        <tr><th>Name</th><th>Seat</th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
    <p class="enjoy">🎬 Enjoy the movie!</p>
    <button id="restartBtn" class="btn secondary">Restart</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
